<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Prezentacja C#</title>
        
        <!-- TRADYCYJNE ŚCIEŻKI WZGLĘDNE DO SKOMPILOWANYCH ASSETÓW -->
		<link rel="stylesheet" href="./dist/reset.css" />
		<link rel="stylesheet" href="./dist/reveal.css" />
		<link rel="stylesheet" href="./dist/theme/black.css" /> 
		<link rel="stylesheet" href="./plugin/highlight/monokai.css" /> 
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- 1. SLAJD TYTUŁOWY -->
				<section>
					<h1>Język C#</h1>
					<h3>Dogłębne poznawanie składni i mechanizmów</h3>
				</section>

				<!-- 2. SLAJD AGENDY -->
				<section>
					<h2>Agenda</h2>
					<p>Treść agendy w czystym HTML, bez Markdown.</p>
				</section>

				<!-- SEKCJA 1: Wprowadzenie i Składnia -->
				<section>
					<section data-menu-title="Wprowadzenie">
						<h2>1. Wprowadzenie i Składnia</h2>
					</section>
					<section>
						<h3>1.1. Historia i cele projektowe C#</h3>
						<ul>
							<li>Twórca: **Anders Hejlsberg**.</li>
							<li>**Debiut:** Rok 2000.</li>
						</ul>
					</section>
				</section>
			</div>
		</div>

        <!-- TRADYCYJNE ŁADOWANIE JS (BEZ MODULE, BEZ IMPORTU) -->
        <script src="./dist/reveal.js"></script>
        <!-- Wtyczki są ładowane jako tradycyjne skrypty, które tworzą zmienne globalne -->
        <script src="./plugin/markdown/markdown.js"></script>
        <script src="./plugin/highlight/highlight.js"></script>
        <script src="./plugin/notes/notes.js"></script>
        
        <script>
            // INICJALIZACJA: Wskazujemy na zmienne globalne
            Reveal.initialize({
                hash: true,
                plugins: [ 
                    RevealMarkdown, 
                    RevealHighlight, 
                    RevealNotes
                ]
            });
		</script>
	</body>
</html>
